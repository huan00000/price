name: Calculate Price

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "symbol.txt"
      - "id.txt"
      - "requirements.txt"
      - ".github/workflows/run.yml"

permissions:
  contents: write

concurrency:
  group: calculate-price
  cancel-in-progress: true

jobs:
  calculate-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up latest Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read symbols and calculate sizes
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -o pipefail

          mapfile -t symbols < <(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' symbol.txt)

          if [ "${#symbols[@]}" -eq 0 ]; then
            echo "symbol.txt does not contain any symbols." >&2
            exit 1
          fi

          printf 'API_KEY=%s\nAPI_SECRET=%s\n' "$API_KEY" "$API_SECRET" > .env
          trap 'rm -f .env' EXIT

          python size.py "${symbols[@]}" | tee size.txt

      - name: Send calculated sizes to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tele_gate.py size.txt id.txt

      - name: Commit size.txt
        shell: bash
        run: |
          if git ls-files --error-unmatch size.txt >/dev/null 2>&1 \
             && git diff --quiet -- size.txt; then
            echo "size.txt is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add size.txt
          git commit -m "chore: update calculated sizes"
          git push
