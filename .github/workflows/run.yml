name: Calculate Price

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "symbol.txt"
      - "id.txt"
      - "requirements.txt"
      - ".github/workflows/run.yml"

permissions:
  contents: write

concurrency:
  group: calculate-price
  cancel-in-progress: true

jobs:
  calculate-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up latest Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read symbols and calculate prices
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -o pipefail

          mapfile -t symbols < <(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' symbol.txt)

          if [ "${#symbols[@]}" -eq 0 ]; then
            echo "symbol.txt does not contain any symbols." >&2
            exit 1
          fi

          raw_output="$(mktemp)"
          trap 'rm -f "$raw_output"' EXIT

          # Keep the full calculation output in the Actions log, but only write
          # symbol sections containing an open long/short FINAL_PRICE to price.txt.
          python price.py "${symbols[@]}" | tee "$raw_output"
          awk '
            BEGIN { RS = ""; ORS = "" }
            /(^|\n)open[[:space:]]+(long|short)[[:space:]]+FINAL_PRICE[[:space:]]*=[[:space:]]*[0-9]+([.][0-9]+)?([[:space:]]*|$)/ {
              if (found++) print "\n"
              print $0 "\n"
            }
          ' "$raw_output" > price.txt

      - name: Send matching prices to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tele_gate.py price.txt id.txt

      - name: Commit Price.txt
        shell: bash
        run: |
          if git diff --quiet -- price.txt; then
            echo "price.txt is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.txt
          git commit -m "chore: update calculated prices"
          git push
